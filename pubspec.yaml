name: safecircle
description: SafeCircle - community safety / panic-alert mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  intl: ^0.19.0
  http: ^1.6.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

  # --- Not enabled yet: wire these in once Maps / messaging are ready ---
  # google_maps_flutter: ^2.6.0   # real map tiles (needs a Google Maps API key)
  geolocator: ^12.0.0           # device GPS location
  geocoding: ^5.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # firebase_messaging: ^17.0.0  # matches "Firebase Cloud Messaging" in the stack
  # dio: ^5.4.1                  # HTTP client for the FastAPI backend

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
