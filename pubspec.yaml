name: safecircle
description: SafeCircle - community safety / panic-alert mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  intl: ^0.19.0
  http: ^1.6.0

  # --- Not enabled yet: wire these in once backend/Firebase/Maps are ready ---
  # (kept out of the active dependency list so `flutter pub get` and a first
  # run work with zero external setup - see README.md "Next steps")
  #
  # google_maps_flutter: ^2.6.0   # real map tiles (needs a Google Maps API key)
  geolocator: ^12.0.0           # device GPS location
  # firebase_core: ^2.27.0        # required by firebase_auth / messaging
  # firebase_auth: ^4.17.0        # matches "Firebase Authentication" in the stack
  # firebase_messaging: ^14.7.20  # matches "Firebase Cloud Messaging" in the stack
  # dio: ^5.4.1                   # HTTP client for the FastAPI backend

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
